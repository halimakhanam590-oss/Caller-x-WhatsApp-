<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Caller X</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase SDK Scripts -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    body { background-color: #0b141a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .chat-bg { background-color: #0b141a; background-image: radial-gradient(#1f2c34 1px, transparent 1px); background-size: 20px 20px; }
    .msg-out { background-color: #005c4b; }
    .msg-in { background-color: #202c33; }
  </style>
</head>
<body class="h-screen flex flex-col justify-between text-gray-100 select-none">

  <!-- Header -->
  <header class="bg-[#202c33] px-4 py-3 flex items-center justify-between shadow-md z-10">
    <div class="flex items-center space-x-3">
      <div class="relative">
        <div class="w-10 h-10 rounded-full bg-emerald-600 flex items-center justify-center font-bold text-lg text-white">
          <i class="fa-solid fa-user-secret"></i>
        </div>
        <span class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 border-2 border-[#202c33] rounded-full"></span>
      </div>
      <div>
        <h1 class="text-base font-semibold leading-tight flex items-center gap-2">
          Caller X <span class="text-[10px] bg-emerald-500/20 text-emerald-400 px-1.5 py-0.5 rounded">PRO</span>
        </h1>
        <p id="userStatus" class="text-xs text-emerald-400">Live Global Room</p>
      </div>
    </div>
    
    <div class="flex items-center space-x-5 text-gray-300">
      <button onclick="alert('Audio calling requires WebRTC integration')" class="hover:text-emerald-400 transition"><i class="fa-solid fa-phone"></i></button>
      <button onclick="alert('Video calling requires WebRTC integration')" class="hover:text-emerald-400 transition"><i class="fa-solid fa-video"></i></button>
    </div>
  </header>

  <!-- Chat Area -->
  <main id="chatBox" class="flex-1 overflow-y-auto p-4 space-y-3 chat-bg flex flex-col">
    <div class="self-center bg-[#182229] text-[#ffd279] text-xs px-3 py-1.5 rounded-lg max-w-[85%] text-center shadow">
      🔒 Caller X Global Encrypted Feed. Messages sync in real-time.
    </div>
  </main>

  <!-- Input Field -->
  <footer class="bg-[#202c33] p-2 flex items-center space-x-2">
    <div class="flex-1 flex items-center bg-[#2a3942] rounded-full px-3 py-1.5">
      <input id="msgInput" type="text" placeholder="Type a message..." class="bg-transparent text-sm w-full outline-none text-white placeholder-gray-400" onkeypress="handleKeyPress(event)">
    </div>
    <button onclick="sendMessage()" class="w-11 h-11 bg-[#00a884] rounded-full flex items-center justify-center text-white shadow-md active:scale-95 transition">
      <i class="fa-solid fa-paper-plane text-sm"></i>
    </button>
  </footer>

  <script>
    // ১. Firebase কনফিগারেশন (আপনার Firebase Console থেকে প্রাপ্ত ডাটা বসান)
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // Firebase ইনিশিয়ালাইজেশন
    let db;
    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
    } catch(e) {
      console.log("Firebase not configured yet, running in demo mode.");
    }

    const chatBox = document.getElementById('chatBox');
    const msgInput = document.getElementById('msgInput');
    
    // প্রতি ব্যবহারকারীর জন্য র‍্যান্ডম আইডি তৈরি
    const myUserId = "user_" + Math.floor(Math.random() * 10000);

    function getCurrentTime() {
      const now = new Date();
      return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    // মেসেজ সেন্ড করার ফাংশন
    function sendMessage() {
      const text = msgInput.value.trim();
      if (!text) return;

      const msgData = {
        sender: myUserId,
        text: text,
        time: getCurrentTime()
      };

      if (db) {
        // ডাটাবেজে মেসেজ পুশ
        db.ref("global_chat").push(msgData);
      } else {
        // ডাটাবেজ ছাড়া লোকাল প্রিভিউ
        renderMessage(msgData);
      }

      msgInput.value = '';
    }

    // স্ক্রিনে মেসেজ দেখানোর ফাংশন
    function renderMessage(data) {
      const isMe = data.sender === myUserId;
      const bubble = document.createElement('div');
      
      bubble.className = isMe 
        ? "self-end msg-out text-white text-sm px-3.5 py-2 rounded-2xl rounded-tr-none max-w-[75%] shadow"
        : "self-start msg-in text-white text-sm px-3.5 py-2 rounded-2xl rounded-tl-none max-w-[75%] shadow";
      
      bubble.innerHTML = `${data.text}<span class="block text-[10px] ${isMe ? 'text-emerald-200' : 'text-gray-400'} text-right mt-1">${data.time}</span>`;
      chatBox.appendChild(bubble);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // রিয়েল-টাইম মেসেজ লিসেনার (অন্যের মেসেজ অটোমেটিক আসা)
    if (db) {
      db.ref("global_chat").limitToLast(50).on("child_added", (snapshot) => {
        const data = snapshot.val();
        renderMessage(data);
      });
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') sendMessage();
    }
  </script>
</body>
</html>
